name: EDENCOVER - Generer APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'icons/**'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Installer SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Construire APK installable de test
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Recuperer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: EDENCOVER-APK-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
