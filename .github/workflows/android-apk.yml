name: EDENCOVER - Generer APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verifier Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Construire APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Telecharger APK
        uses: actions/upload-artifact@v4
        with:
          name: EDENCOVER-APK-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

